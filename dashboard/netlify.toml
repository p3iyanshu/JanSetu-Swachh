# Netlify settings for the web portal. In the Netlify UI set Base directory
# to "dashboard"; the build command and publish folder below are then used.
# Set VITE_API_BASE_URL (e.g. https://jansetu-swachh-api.onrender.com/api/v1)
# under Site configuration -> Environment variables.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: serve index.html for any path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# server.json holds the current backend address; the Android app and the
# admin desktop app read it from other origins, and it must never be cached.
[[headers]]
  for = "/server.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "no-cache"
