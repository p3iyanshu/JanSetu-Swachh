name: jansetu_mobile
description: "JanSetu Citizen App — Accessibility-first civic issue reporting app for SIH2026."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7
  speech_to_text: ^7.4.0
  dio: ^5.4.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  path_provider: ^2.1.2
  record: 5.2.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.5
  image: ^4.2.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dependency_overrides:
  record_platform_interface: 1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/indian_emblem.png
